<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanh toán — MONO. Studio</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="checkout">

  <div class="wrap" id="checkout-root">
    <div class="page-head">
      <div class="crumbs"><a href="/index.html">Trang chủ</a> / Thanh toán</div>
      <h1>Thanh toán</h1>
    </div>

    <div class="checkout-grid">
      <form id="checkout-form" novalidate>
        <div class="panel">
          <h2>Thông tin giao hàng</h2>
          <div class="field"><label for="f-name">Họ tên *</label><input id="f-name" autocomplete="name" required>
            <div class="err-msg">Vui lòng nhập họ tên</div></div>
          <div class="field"><label for="f-phone">Số điện thoại *</label><input id="f-phone" type="tel" autocomplete="tel" required>
            <div class="err-msg">Vui lòng nhập số điện thoại</div></div>
          <div class="field"><label for="f-email">Email</label><input id="f-email" type="email" autocomplete="email"></div>
          <div class="field"><label for="f-address">Địa chỉ nhận hàng *</label><input id="f-address" autocomplete="street-address" required>
            <div class="err-msg">Vui lòng nhập địa chỉ</div></div>
          <div class="field"><label for="f-note">Ghi chú</label><textarea id="f-note" rows="2"></textarea></div>

          <div class="opt-label">Phương thức thanh toán</div>
          <div class="pay-methods">
            <label><input type="radio" name="pay" value="cod" checked>
              <span><b>Thanh toán khi nhận hàng (COD)</b><small>Trả tiền mặt cho shipper khi nhận</small></span></label>
            <label><input type="radio" name="pay" value="gateway">
              <span><b>Cổng thanh toán online</b><small>Demo gateway giả lập VNPay/Stripe — không thu tiền thật</small></span></label>
          </div>

          <button class="btn" id="place-order" style="width:100%;margin-top:22px">Đặt hàng</button>
        </div>
      </form>

      <aside class="summary" aria-label="Tóm tắt đơn hàng">
        <h3>Đơn hàng</h3>
        <div id="sum-items"></div>
        <div class="row"><span>Tạm tính</span><span id="sum-sub">0₫</span></div>
        <div class="row"><span>Phí ship (miễn phí từ 500K)</span><span id="sum-ship">0₫</span></div>
        <div class="row total"><span>Tổng cộng</span><span id="sum-total">0₫</span></div>
      </aside>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/partials.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
